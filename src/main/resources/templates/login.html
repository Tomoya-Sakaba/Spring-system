<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Login</title>
</head>
<body>
    <h2>ログインページ</h2>
    
    <span th:text="${errorMsg}" style="color: red;"></span>

    <form th:action="@{/login}" method="post" th:object="${loginForm}">
        
        <label>email</label>
        <input type="text" th:field="*{email}"><br>
        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: red;"></span><br>
        
        
        <label>Password</label>
        <input type="password" th:field="*{password}"><br>
        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: red;"></span><br>
        
        <input type="submit" value="Login"/>
    </form>

</body>
</html>
